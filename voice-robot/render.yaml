services:
  - type: web
    name: beton42-maria-voice
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend_maria:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AMOCRM_ACCESS_TOKEN
        sync: false
      - key: AMOCRM_BASE_URL
        value: https://shef1664.amocrm.ru
      - key: AMOCRM_PHONE_FIELD_ID
        value: "1503041"
      - key: AMOCRM_PIPELINE_ID
        value: "10818570"
      - key: AMOCRM_NEW_STATUS_ID
        value: "85162970"
      - key: AMOCRM_TRANSFER_STATUS_ID
        value: "85162982"
      - key: VOXIMPLANT_WEBHOOK_SECRET
        sync: false
      - key: SPEECHKIT_API_KEY
        sync: false
